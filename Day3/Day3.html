<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
    forms
    block level element
    inline element
    semantic elements
    
    forms:
    ----------
    forms are used to collect user data and allow users to interact with the server.
    ->It is defined with <form></form>tag

    form fields
    =============
    We have three types of form fields.
    1)label

    2)input : It is a text field.
    -> Inside the form text field we have two attributes.

    a)type attribute:
    type attribute is used to control the text field.
    type-text,number,password,email(validation is done when we are submitting the form),
    url,search,file

    b)placeholder : it gives the hint to the user "what to fill".

    3)button
    In buttons we have the type attribute
    type-submit,reset

    -->

    <form>
        <label>enter username</label>
        <input type="text" placeholder="enter name">
        <input type="number">
        <input type="password">
        <input type="email">
        <input type="url">
        <input type="search">
        <input type="file">
        <input type="date">
        <input type="datetime-local">
        <button type="submit">submit</button>
        <button type="reset">reset</button>
    </form>
</body>
</html>
