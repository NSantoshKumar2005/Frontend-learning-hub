<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
</head>

<body>
    <h1>Create Your Account</h1>
    <p>Join us and get started today</p>
    <form>
        <label for="relation">Full Name</label> <br>
        <input id="relation" type="text" placeholder="Enter Your Full Name" name="name"> <br>
        
        <label for="connection">Email address</label> <br>
        <input id="connection" placeholder="Enter Your Email"> <br>
        
        <label for="match">Password</label> <br>
        <input id="match" type="password" placeholder="Create a Password"> <br>

        <label for="same">Confirm Password</label> <br>
        <input id="same" type="password" placeholder="Confirm Your Password"> <br>

        <label>Gender</label> <br>
        <input id="m" type="radio" name="Gender" value="Male">
        <label for="m">Male</label> 
        
        <input id="f" type="radio" name="Gender" value="Female">
        <label for="f">Female</label>
        
        <input id="O" type="radio" name="Gender" value="Others">
        <label for="O">Others</label> <br>

        <label for="DOB">Date Of Birth</label> <br>
        <input id="DOB" type="date" placeholder="Select your date of birth"> <br>

        <label for="country">Country</label><br>
        <select id="country" name="country">
            <option value="India">India</option>
            <option value="Australia">Australia</option>
            <option value="Netherlands">Netherlands</option>
        </select> <br>
        <input id="c" type="checkbox" required>
        <label for="c">I agree to the Terms of Service and Privacy Policy</label> <br> <br>
        <button type="submit">Register Now</button>
        
        <p>Already have an account? <a href="">Login</a></p>
        
    </form>
</body>

</html>
