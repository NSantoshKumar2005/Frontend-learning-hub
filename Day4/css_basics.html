<!--
How to add css:

Three ways to insert css.

1)External css:

Points to rememeber:

->link should be there in head in html file.
->Each individual file should be there for html and css.

syntax for link:
<link>rel="stylesheet" href="mycss.css"</link>

Program:
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <h1>Hello</h1>
    <p>world</p>
</body>
</html>

2)Internal Css:

Points to remember:
->By using style tag we used to access the css.

Program:
<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        h1 {
            color: navy;
        }

        body {
            background-color: beige;
        }
        p{
            color:palevioletred;

        }
    </style>
</head>

<body>
    <h1>python life</h1>
    <p>Your friend</p>
</body>

</html>

3)Inline css - for unique style

Program:
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css inline</title>
</head>

<body>
    <h1 style="color:black;background-color: aqua;">Welcome to inline css</h1>
    <p style="color:green;font-size:15px;">Thankyou</p>
</body>

</html>

<!DOCTYPE html>

    <!--     css - cascading style sheets

    it is a style sheet language that is used to describe the presentation of html document.
    css styles deals colors,fonts,animations,layouts and responsiveness

    how to insert css:
    1)inline css :
    It is added to the tag with the help of style attribute.
    css styles comes with property and values.

    css syntax:
    ------------
    color:red;
    declaration

    inserting css syntax:
    <h1 style="color:red;background:blue;">primary heading</h1>

    2)internal css
    styles are defined in head section with the style tag.

    css syntax:
    ------------
    selector : it is used to target the html tags for applying styles.

    selector{
        declaration
            }
    h2{
        color:yellow
      }

    3)external css:
    external styles are defined in external file that has extension of .css.
    external file can be linked using link tag in head section.

    <link rel="stylesheet" href="demo.css">

    priority:
    1)inline
    2)internal or external - it depends how we define

    <h1 style="color:red;background:blue;">inline heading</h1>
    
    <h2>internal heading</h2>
    <h3>external heading</h3>

    1)simple selectors:
        1)tag name or element selector
        h1{
            color:red;
        }

        we can assign multiple classnames in class attribute.

        <div class="s1 a1">

            }
