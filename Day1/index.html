<!--
Basic html structure 
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <title>First Webpage</title>
</head>

<body>
    <!-- Heading tags -->
    <h1>Welcome to the html</h1>
    <h2>Welcome to the works</h2>
    <h3>Welcome to the representation of tags</h3>
    <h4>Welcome to the structure</h4>
    <h5>Welcome to the heading tags</h5>
    <h6>It is end of heading tags</h6>
    <!-- EMMETS
    1)shift 1 - basic structure of html
    2)tag name - h1 + enter
    3)If you want 10 h1 tags - h1*10 + enter
    4)If we want to write content inside the tag - h1{Primary}
    5)If we want to write content 10 times inside the specific tag - h1*10{content}
    6)Nested tags - h1>h2>h3
    7)Comment lines - Control + /
    -->

    <!-- Paragraph tags -->
    <p>lorem epsum</p>


    <!-- 
    attributes : It provides the extra information and controls the tag behaviour.
    
    anchor tags : It is used to define hyperlinks. It is used for internal routing and external routing. 
    
    Empty href and target attribute usage :
    ----------------------------------------
    <a href="" target="_self">e</a><br> Here,target _self -- opening on same tab
    <a href="" target="_blank">a</a>    Here, target _blank -- Opening in another tab

    External routing:
    1)Absolute : It routes to outside webpage.
    Ex:
    <a href="https://en.wikipedia.org/wiki/HTML" target="_self">content</a>

    2)Relative : It routes to inside html files.
    Ex:
    <a href="h.html" target="_blank">Projects Page</a>
    -->
    <a href="https://en.wikipedia.org/wiki/HTML" target="_self">content</a><br>
    <a href="h.html" target="_blank">Primary Heading Page</a> 
    <hr>

    <!--
    Self-closing tag:
    ------------------
    1)hr tag : horizontal ruler.
    2)br tag : It is used to break the content into next line.
    -->

    <!--

    List tags:
    ----------
    1)ordered list :
    2)unordered list :

    -->

    <ol type="I" start="2">
    <li>Banana</li>
    <li>Mango</li>
    <li>Promogranate</li>
    </ol>

    <ul>
        <li>Vegetables</li>
        <li>Fruites</li>
        <li>Liquids</li>
    </ul>

</body>

</html>
